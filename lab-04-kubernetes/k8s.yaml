# The Lab 03 app on Kubernetes. Compare it with lab-03-compose/app/compose.yaml:
# the comments say which part of compose.yaml each piece replaces.
apiVersion: apps/v1
kind: Deployment              # compose: services: web
metadata:
  name: web
spec:
  replicas: 3                 # compose: --scale web=3, but here it works
  selector:
    matchLabels: { app: web }
  template:                   # the Pod that the Deployment makes copies of
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: lab03-web:1.0
          envFrom:
            - configMapRef: { name: student }   # compose: environment (from .env)
          readinessProbe:     # send traffic only once port 8000 answers
            tcpSocket: { port: 8000 }
---
apiVersion: v1
kind: Service                 # compose: the name "web" and ports: "80:8000"
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }      # every Pod with this label gets traffic
  ports:
    - { port: 80, targetPort: 8000, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment              # compose: services: redis
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }   # a database: never two copies on one volume
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:     # compose: healthcheck
            exec: { command: ["redis-cli", "ping"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service                 # compose: the name "redis" that app.py connects to
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { port: 6379 }
---
apiVersion: v1
kind: PersistentVolumeClaim   # compose: volumes: redis-data
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 100Mi }
