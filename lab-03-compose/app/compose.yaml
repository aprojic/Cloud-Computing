services:
  web:
    build: .
    ports:
      - "80:8000"
    environment:
      STUDENT_NAME: ${STUDENT_NAME}
      CODESPACE_NAME: ${CODESPACE_NAME}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

volumes:
  redis-data:
